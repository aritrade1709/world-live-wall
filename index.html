<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Live Wall — 2,300 live traffic cameras, at once</title>
<meta name="description" content="2,300 public traffic cameras streaming live video, from London and California, on one page. Click any tile to play it.">
</head>
<body>
  <header>
    <div class="bar">
      <h1><span class="dot"></span>World Live Wall</h1>
      <div class="stats">
        <span><b id="stat-live">0</b> on screen</span>
        <span><b id="stat-total">0</b> live cameras</span>
        <span class="sched"><b id="stat-flight">0</b> in flight</span>
        <span class="sched"><b id="stat-queued">0</b> queued</span>
      </div>
    </div>
    <nav id="filters"></nav>
  </header>

  <main id="grid"></main>

  <div id="lightbox" hidden>
    <div class="stage">
      <img id="lightbox-img" alt="">
      <video id="lightbox-video" muted playsinline hidden></video>
      <span id="lightbox-badge" hidden>LIVE</span>
    </div>
    <div class="meta">
      <strong id="lightbox-name"></strong>
      <span id="lightbox-meta"></span>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
